<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 파이프라인 지도</title>
<meta name="description" content="Google Cloud Data Engineer 과정 전체 흐름을 한 장에: 흩어진 데이터를 모으고, 다듬고, 쌓고, 쓰게 하는 길">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#202124; --muted:#5f6368; --line:#dadce0; --card:#ffffff;
  --blue:#1a73e8; --blue-soft:#e8f0fe; --pipe:#d2e3fc;
  --tip:#fef7e0; --tip-line:#f9ab00; --tip-ink:#3c2f00; --glow:251,188,4;
}
:root[data-theme="dark"]{
  --bg:#1f2023; --ink:#e8eaed; --muted:#9aa0a6; --line:#3c4043; --card:#26282c;
  --blue:#8ab4f8; --blue-soft:#1d2a3f; --pipe:#2c3e5c;
  --tip:#3a3010; --tip-line:#fbbc04; --tip-ink:#fdf3cf;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:19px;line-height:1.35;
  padding:22px 28px 18px;max-width:1880px;margin:0 auto}
a{color:inherit;text-decoration:none}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
h1{font-size:40px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h1 span{display:block;font-weight:500;color:var(--muted);font-size:21px;margin-top:6px;letter-spacing:0}
.mode{flex:none;font:inherit;font-size:16px;color:var(--muted);background:none;border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.mode:hover{color:var(--ink);border-color:var(--muted)}

/* 다섯 단계와 그 위를 지나는 파이프 */
.stages{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.pipe{position:absolute;left:10%;right:10%;top:17px;height:10px;border-radius:5px;background:var(--pipe);overflow:hidden}
.pipe::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,var(--blue) 0 18px,transparent 18px 46px);opacity:.55;
  animation:flow 1.6s linear infinite}
@keyframes flow{from{transform:translateX(-46px)}to{transform:translateX(0)}}
.pipe-end{position:absolute;right:calc(10% - 16px);top:12px;width:0;height:0;
  border-left:18px solid var(--blue);border-top:10px solid transparent;border-bottom:10px solid transparent;opacity:.8}

.sh{text-align:center;margin-bottom:10px;position:relative}
.dot{display:grid;margin:0 auto;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--blue);
  color:#fff;font-weight:700;font-size:20px;position:relative;z-index:1;border:4px solid var(--bg)}
.s0 .dot{background:var(--muted)}
.sh h2{margin:4px 0 0;font-size:26px;font-weight:700}
.sh h2 small{font-size:17px;font-weight:500;color:var(--muted);margin-left:4px}
.sh p{margin:0;font-size:16px;color:var(--muted)}

.cards{display:flex;flex-direction:column;gap:9px}
.card{position:relative;display:grid;grid-template-columns:52px 1fr;grid-template-areas:"nm nm" "ic sub" "ic dest";
  column-gap:12px;row-gap:2px;align-items:center;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:10px 14px 11px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.card .nm{grid-area:nm;font-weight:700;font-size:19px;line-height:1.2;margin-bottom:5px}
.card .sub{grid-area:sub;font-size:15px;color:var(--muted);align-self:end}
.card .ic{grid-area:ic;width:52px;height:52px}
.card .dest{grid-area:dest;justify-self:start;align-self:start;font-size:15px;font-weight:500;color:var(--blue);
  background:var(--blue-soft);border-radius:999px;padding:1px 10px}
.card.src{background:transparent;border-style:dashed}
.card.src .ic{opacity:.85}

.herowrap{border:2.5px solid var(--blue);border-radius:16px;background:var(--blue-soft);padding:4px}
.herowrap .card{border-color:transparent;background:var(--card)}
.herowrap .card .nm{font-size:24px}
.df{position:relative;display:block;margin:4px 2px 2px;padding:6px 10px;border-radius:10px;font-size:15px;
  transition:transform .18s ease,box-shadow .18s ease}
.df .nm{font-weight:700;font-size:17px;margin-right:6px}
.df .sub{color:var(--muted)}
.elt{position:relative;display:flex;flex-direction:column;gap:2px;border:2px dashed var(--blue);border-radius:14px;
  padding:10px 14px;color:var(--blue);transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.elt .nm{font-weight:700;font-size:18px;line-height:1.25}
.elt .sub{font-size:15px}
.elt:hover,.elt:focus-visible{z-index:20;transform:scale(1.05);border-color:var(--tip-line);
  box-shadow:0 0 0 3px rgba(var(--glow),.55),0 10px 28px rgba(var(--glow),.35);outline:none}
.elt:hover>.tip,.elt:focus-visible>.tip{display:block}

/* hover: 살짝 다가오며 반짝, 노란 상자에 무엇·왜 */
a.card:hover,a.card:focus-visible,.card.src:hover,.card.src:focus-visible,a.df:hover,a.df:focus-visible,a.chip:hover,a.chip:focus-visible{
  z-index:20;transform:scale(1.05);border-color:var(--tip-line);
  box-shadow:0 0 0 3px rgba(var(--glow),.55),0 10px 28px rgba(var(--glow),.35);outline:none}
a.card::after,a.chip::after,a.df::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  background-size:250% 100%;background-position:120% 0;opacity:0}
a.card:hover::after,a.chip:hover::after,a.df:hover::after{animation:shine .7s ease-out;opacity:1}
@keyframes shine{from{background-position:120% 0}to{background-position:-30% 0}}
a.card:hover .ic,a.chip:hover .ic{animation:pop .45s ease-out}
@keyframes pop{40%{transform:scale(1.14) rotate(-4deg)}100%{transform:none}}

.tip{position:absolute;left:0;top:calc(100% + 8px);width:min(320px,90vw);z-index:30;display:none;
  background:var(--tip);color:var(--tip-ink);border:2px solid var(--tip-line);border-radius:12px;
  padding:10px 14px;font-size:17px;line-height:1.4;font-weight:400;text-align:left;
  box-shadow:0 8px 22px rgba(0,0,0,.14)}
.tip b{display:block;font-size:14px;color:#b06000;margin-top:4px}
:root[data-theme="dark"] .tip b{color:#fbbc04}
.tip b:first-child{margin-top:0}
.s3 .tip,.s4 .tip{left:auto;right:0}
.card:hover>.tip,.card:focus-visible>.tip,.df:hover>.tip,.df:focus-visible>.tip,.chip:hover>.tip,.chip:focus-visible>.tip{display:block}

/* 아래 두 띠: 자동화와 지키기 */
.bands{display:grid;grid-template-columns:5fr 3fr;gap:14px;margin-top:16px}
.band{border-top:3px solid var(--line);padding-top:8px}
.band header{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.band h2{margin:0;font-size:24px}
.band h2 small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px}
.band p{margin:0;font-size:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;flex:1 1 0;min-width:150px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.chip .nm{font-weight:700;font-size:17px;line-height:1.2}
.chip .sub{display:block;font-size:14px;color:var(--muted)}
.chip .ct{order:-1}
.chip .ic{width:36px;height:36px;margin-top:auto}
.chip .tip{top:auto;bottom:calc(100% + 8px)}
.band:last-child .chip:last-child .tip,.band:first-child .chip:nth-child(n+4) .tip{left:auto;right:0}

.refs{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;font-size:15px;color:var(--muted)}
.refs a{text-decoration:underline;text-underline-offset:3px}
.refs a:hover{color:var(--blue)}
.refs .own{margin-left:auto}

@media (max-width:1100px){
  body{padding:18px 16px}
  h1{font-size:30px} h1 span{font-size:18px}
  .stages{grid-template-columns:1fr;gap:18px}
  .pipe,.pipe-end{display:none}
  .sh{display:flex;align-items:center;gap:10px;text-align:left;border-bottom:2px solid var(--pipe);padding-bottom:6px}
  .sh h2{margin:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .bands{grid-template-columns:1fr}
}
@media (hover:none){
  .tip{display:block;position:static;width:auto;margin-top:8px;box-shadow:none;grid-column:1/-1;font-size:16px}
  .chip .tip{margin-top:4px}
}
@media (prefers-reduced-motion:reduce){
  .pipe::after{animation:none}
  a.card:hover::after,a.chip:hover::after,a.df:hover::after,a.card:hover .ic,a.chip:hover .ic{animation:none}
  .card,.chip,.df{transition:none}
}
</style>
</head>
<body>
<div class="top">
  <h1>데이터 파이프라인: 흩어진 데이터를 모아, 다듬고, 쌓아, 쓰게 만든다
    <span>Google Cloud Data Engineer 과정의 전체 흐름이에요. 이름에 마우스를 올리면 설명이, 누르면 공식 문서가 새 창으로 열려요.</span></h1>
  <button class="mode" type="button" id="mode">어둡게 보기</button>
</div>
<main>
  <div class="stages"><div class="pipe" aria-hidden="true"></div><div class="pipe-end" aria-hidden="true"></div>{{STAGES}}</div>
  <div class="bands">{{BANDS}}</div>
</main>
<footer class="refs">{{REFS}}<span class="own">아이콘: Google Cloud 공식 아이콘 · © Daun Lee</span></footer>
<script>
(function(){
  // 넓은 화면에서는 한 화면에 다 들어오게 줄인다
  function fit(){
    var s=document.body.style; s.zoom='';
    if(innerWidth<=1100) return;
    var h=document.documentElement.scrollHeight;
    if(h>innerHeight) s.zoom=Math.max(.7,innerHeight/h).toFixed(3);
  }
  addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
  fit();
})();
(function(){
  var b=document.getElementById('mode'), r=document.documentElement;
  function set(t){ if(t==='dark'){r.setAttribute('data-theme','dark');b.textContent='밝게 보기';}
    else{r.removeAttribute('data-theme');b.textContent='어둡게 보기';} }
  try{ set(localStorage.getItem('pipeline.theme')); }catch(e){}
  b.addEventListener('click',function(){
    var t=r.getAttribute('data-theme')==='dark'?'light':'dark'; set(t);
    try{ localStorage.setItem('pipeline.theme',t); }catch(e){}
  });
})();
</script>
</body>
</html>
